<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="index.css">
</head>
<body>
    
    <h1>International Holiday Countdown</h1>

<div class="buttons">
    <button data-country="CZ">🇨🇿 CZ</button>
    <button data-country="US">🇺🇸 US</button>
    <button data-country="DE">🇩🇪 DE</button>
</div>

<div class="panel">
    <h2 id="holidayName">Vyber zemi</h2>
    <p id="holidayDate"></p>
</div>

<div class="countdown">
    <span id="days">0</span> :
    <span id="hours">0</span> :
    <span id="minutes">0</span> :
    <span id="seconds">0</span>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
